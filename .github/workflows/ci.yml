name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
  # Semanal, para que govulncheck vea las vulnerabilidades publicadas
  # después del último cambio.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Las acciones se fijan por SHA (no por etiqueta, que puede moverse); el
# comentario indica la versión. Para actualizarlas, ver CONTRIBUTING.md.
jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Pruebas
        run: go test -race -count=1 ./...
      - name: Sin cgo
        run: CGO_ENABLED=0 go build ./...

  # Vulnerabilidades conocidas en el código y sus dependencias.
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: Módulos verificados
        run: go mod verify
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Contraste con implementaciones independientes: xmlsec1 (firma) y
  # xmllint de libxml2 (C14N y XSD). Ver internal/interop.
  interoperabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1 libxml2-utils && xmlsec1 --version && xmllint --version
      - name: xmlsec1 y xmllint
        run: SRI_INTEROP=1 go test -count=1 -v ./internal/interop
      - name: Fuzzing breve
        run: |
          go test -run='^$' -fuzz=FuzzC14NIdempotente -fuzztime=30s ./internal/xmldom
          go test -run='^$' -fuzz=FuzzNormalizacionDeAtributos -fuzztime=30s ./internal/xmldom
